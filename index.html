<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon" rel="icon" type="image/webp" href="/orange/4.webp" />
    <script>
      (() => {
        const pinkAssets = ['4', '6', '7', '10', '15', '18', '19', '20', '25', '28', '33', '36'];
        const yellowAssets = [
          '1',
          '2',
          '3',
          '4',
          '5',
          '6',
          '7',
          '8',
          '9',
        ];
        const yellow = localStorage.getItem('ui_theme') === 'yellow';
        const assets = yellow ? yellowAssets : pinkAssets;
        const icon = assets[Math.floor(Math.random() * assets.length)];
        document.getElementById('favicon')?.setAttribute('href', `/${yellow ? 'suzuran' : 'orange'}/${icon}.webp`);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>autochess-config-page</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
